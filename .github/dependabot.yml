version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      twilight:
        patterns:
          - "twilight-*"
    ignore:
      - dependency-name: "axum"
        versions: [">=0.8.0"]
      - dependency-name: "sha2"
        versions: [">=0.11.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
