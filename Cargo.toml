[package]
name = "paladinscat-discord-bot"
version = "0.1.0"
edition = "2021"
description = "High-performance PaladinsCat Discord bot — Twilight + Tokio"

[dependencies]
# Discord gateway & REST
twilight-gateway = "0.16"
twilight-http = "0.16"
twilight-model = "0.16"
twilight-cache-inmemory = "0.16"
twilight-util = { version = "0.16", features = ["builder"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP client (PaladinsCat API)
reqwest = { version = "0.12", features = ["json"] }

# Image processing (replaces sharp)
image = "0.24"

# In-memory cache (replaces RenderCache)
moka = { version = "0.12", features = ["future"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
config = "0.14"

# Embedded HTTP health server (replaces health.ts)
axum = "0.7"

# UUID
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Hashing
sha2 = "0.10"

# URL percent-encoding
percent-encoding = "2"

# Unicode normalization (NFKD for champion name matching)
unicode-normalization = "0.1"